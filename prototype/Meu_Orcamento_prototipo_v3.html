<style>

.cd.dn{display:flex;align-items:center;gap:16px;color:var(--on-sf)}.dn svg{width:132px;height:132px;flex:none}.lg{flex:1;min-width:0}.lg>div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px}

:root{--sf:#F1F3F4;--s1:#fff;--s2:#fff;--s3:#EEF0F3;--s4:#E3E6EB;--pr:#0057B8;--on-pr:#fff;--pc:#E3E8F6;--on-pc:#1D2B53;--sc:#E3E8F6;--on-sc:#1D2B53;--on-sf:#1D2B53;--on-sv:#5B6478;--ol:#B8BECB;--olv:#E1E4EA;--n1:#1D2B53;--tb:#1D2B53}

<script>
(()=>{
const loadScript=url=>new Promise((ok,no)=>{const hit=document.querySelector('script[data-lib="'+url+'"]');if(hit)return hit.dataset.ready==='1'?ok():hit.addEventListener('load',ok);const s=document.createElement('script');s.src=url;s.dataset.lib=url;s.onload=()=>{s.dataset.ready='1';ok();};s.onerror=()=>no(new Error('falha ao carregar '+url));document.head.appendChild(s);});
const ensureXlsx=()=>loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
const ensurePdfJs=async()=>{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';};

const KEY='orcamento-vf-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const addM=(k,n)=>{const [y,m]=k.split('-').map(Number);return mk(new Date(y,m-1+n,1));};

function alertasDoMes(k){
  const lim=(S.limites&&S.limites.global)||80;
  const out=[];
  // total
  const pD=['F','V','E'].reduce((s,t)=>s+T(t,k,pl),0);
  const rD=['F','V','E'].reduce((s,t)=>s+T(t,k,re),0);
  if(pD>0){
    const pct=rD/pD*100;
    if(pct>=100) out.push({nivel:'er',escopo:'total',msg:`Despesas do mês estourou o planejado (${brl(rD)} de ${brl(pD)})`});
    else if(pct>=lim) out.push({nivel:'wa',escopo:'total',msg:`Despesas do mês em ${pct.toFixed(0)}% do planejado (limite ${lim}%)`});
  }
  // categories
  ['F','V','E'].forEach(t=>{
    const its=S.itens.filter(i=>i.tipo===t);
    const gs=[...new Set(its.map(i=>i.grupo))];
    gs.forEach(g=>{
      const li=its.filter(i=>i.grupo===g);
      const p=li.reduce((s,i)=>s+pl(i,k),0);
      const r=li.reduce((s,i)=>s+re(i,k),0);
      if(p>0){
        const pct=r/p*100;
        const limCat=(S.limites&&S.limites.cats&&S.limites.cats[g]!=null)?S.limites.cats[g]:lim;
        if(pct>=100) out.push({nivel:'er',escopo:'cat',cat:g,msg:`${g}: estourou (${brl(r)} de ${brl(p)})`});
        else if(pct>=limCat) out.push({nivel:'wa',escopo:'cat',cat:g,msg:`${g}: ${pct.toFixed(0)}% do planejado (limite ${limCat}%)`});
      }
    });
  });
  return out;
}

    ${isGrp?`<div class="tf fl"><select id="e-scope"><option value="one">Só esta parcela</option><option value="future">Esta e as futuras</option></select><label>Escopo da alteração</label></div>`:''}

    const imp=ui.imp,cols=imp.headers||[],m=imp.map||{};

      <div class="ac"><button class="bt f sl" data-a="fechar">Fechar</button></div></div>`;
    return`<div class="sh"><div class="hnd"></div><h3>Importar planilha</h3>
      <p class="sp">Aceita CSV, XLSX, XLS e ODS. Detecta “Vida Financeira” ou permite mapear colunas manualmente.</p>
      <button class="bt o sl" data-a="pick-plan" style="width:100%;margin:8px 0">${imp.rows.length?'Trocar arquivo…':'Escolher arquivo…'}</button>
      ${imp.sheets.length>1?`<div class="tf fl"><select id="imp-sheet">${imp.sheets.map(n=>`<option value="${esc(n)}"${n===imp.sheetName?' selected':''}>${esc(n)}</option>`).join('')}</select><label for="imp-sheet">Aba</label></div>`:''}
      ${imp.rows.length&&imp.kind==='lanc'?`<div class="imp-map">
        <p class="lb">Mapeamento de colunas</p>
        ${impMapSelect('im-data','Data *',cols,m.data)}
        ${impMapSelect('im-valor','Valor *',cols,m.valor)}
        ${impMapSelect('im-desc','Descrição',cols,m.desc)}
        ${impMapSelect('im-cat','Categoria',cols,m.cat)}
        ${impMapSelect('im-item','Item',cols,m.item)}
        <label class="sp" style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="im-create" ${imp.createItems?'checked':''}> Criar categorias/itens faltantes</label>
      </div>`:''}
      ${imp.kind==='plano'||imp.kind==='vf'?`<p class="sp">${imp.kind==='vf'?'Modelo Vida Financeira detectado.':'Layout de orçamento mensal detectado.'} Confirme para importar planejamento.</p>`:''}
      ${imp.preview.length?impPreviewTbl(imp.preview):''}
      <div class="ac">
        <button class="bt t sl" data-a="fechar">Cancelar</button>
        ${imp.rows.length&&!imp.preview.length?`<button class="bt o sl" data-a="imp-prev">Gerar prévia</button>`:''}
        ${imp.preview.length?`<button class="bt f sl" data-a="imp-go">Confirmar importação</button>`:''}
      </div></div>`;
  }
  if(s==='import-pdf'){
    const imp=ui.imp;
    if(imp.step==='done'&&imp.report)return`<div class="sh"><div class="hnd"></div><h3>Fatura importada</h3>
      <p class="sp">Importados: <b>${imp.report.imp}</b> · Ignorados: <b>${imp.report.skip}</b> · Rejeitados: <b>${imp.report.rej}</b></p>
      <div class="ac"><button class="bt f sl" data-a="fechar">Fechar</button></div></div>`;
    return`<div class="sh"><div class="hnd"></div><h3>Importar fatura (PDF)</h3>
      <p class="sp">PDF com texto selecionável (não funciona com scan/foto). Revise a prévia antes de confirmar.</p>
      <button class="bt o sl" data-a="pick-pdf" style="width:100%;margin:8px 0">${imp.preview.length?'Trocar PDF…':'Escolher PDF…'}</button>
      <div class="tf fl"><select id="im-card"><option value="">— selecione —</option>${S.cartoes.map(k=>`<option value="${k.id}"${k.id===imp.cardId?' selected':''}>${esc(k.nome)}</option>`).join('')}</select><label for="im-card">Cartão de destino *</label></div>
      ${!S.cartoes.length?'<p class="sp er">Cadastre um cartão em Ajustes antes de importar.</p>':''}
      <label class="sp" style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="im-create" ${imp.createItems?'checked':''}> Criar itens faltantes automaticamente</label>
      ${imp.preview.length?impPreviewTbl(imp.preview):'<p class="em">Nenhuma linha extraída ainda.</p>'}
      <div class="ac">
        <button class="bt t sl" data-a="fechar">Cancelar</button>
        ${imp.preview.length?`<button class="bt f sl" data-a="imp-go">Confirmar importação</button>`:''}
      </div></div>`;
  }
  return vGuia();
}
function prev(){

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true;},3000);}
function showUndo(msg){

  clearTimeout(showUndo.t);

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){ui.sheet=null;render();return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a!=='demo'&&a!=='reset')ui.arm=null;
  if(a==='tab')ui.tab=b.dataset.t;
  else if(a==='mes')ui.mes=addM(ui.mes,+b.dataset.d);
  else if(a==='tipo')ui.t=b.dataset.t;
  else if(a==='ano')ui.mes=addM(ui.mes,12*+b.dataset.d);
  else if(a==='det'){ui.tab='orc';ui.t=b.dataset.t;ui.mes=ui.ate;}
  else if(a==='modo')ui.real=b.dataset.r==='1';
  else if(a==='anoopen'){ui.openAno=ui.openAno||{};const t=b.dataset.t;ui.openAno[t]=!ui.openAno[t];}
  else if(a==='open'){const key=ui.t+b.dataset.g;ui.open[key]=!ui.open[key];}
  else if(a==='novo')ui.sheet='novo';
  else if(a==='fechar'){if(ui.sheet==='import-plan'||ui.sheet==='import-pdf')resetImp();ui.sheet=null;}
  else if(a==='guia'){const d=RD();ui.guia=((d.tem?d.saldoR:d.saldoP)<0)?'neg':'pos';ui.sheet='guia';}
  else if(a==='plan'){ui.sid=id;ui.sheet='plan';}
  else if(a==='aplicar'){const v=num($('#pv').value);for(let n=0;n<12;n++)$('#p'+n).value=v;return;}
  else if(a==='saveplan'){const i=item(ui.sid);i.plano=MS.map((_,n)=>num($('#p'+n).value));ui.sheet=null;save();toast('Planejamento salvo');}
  else if(a==='novoitem')ui.sheet='item';
  else if(a==='saveitem'){
    const g=$('#n-g').value.trim(),n=$('#n-n').value.trim();
    if(!g||!n){toast('Informe a categoria e o nome.');return;}
    S.itens.push({id:'i'+uid(),tipo:ui.t,grupo:g,nome:n,div:false,plano:Array(12).fill(num($('#n-v').value))});ui.open[ui.t+g]=true;ui.sheet=null;save();toast('Item criado');
  }
  else if(a==='salvar'){
    const tp=$('#f-t').value,v=num($('#f-v').value),dt=$('#f-dt').value,meio=tp==='D'?$('#f-m').value:'deb',n=['deb','pix','din'].includes(meio)?1:Math.max(1,Math.min(60,parseInt($('#f-n').value)||1)),it=$('#f-i').value;
    if(!(v>0)||!dt||!it){toast('Informe o valor, a data e o item.');return;}
    S.lanc.push(...gerar({item:it,desc:$('#f-d').value.trim()||item(it).nome,valor:v,meio,data:dt,n}));
    ui.mes=dt.slice(0,7);ui.sheet=null;save();toast(n>1?n+' parcelas lançadas':'Lançamento salvo');
  }
  else if(a==='del'){
    const removed=S.lanc.filter(l=>l.id===id);
    S.lanc=S.lanc.filter(l=>l.id!==id);save();
    ui.undo={type:'lanc',items:removed,ts:Date.now()};
    showUndo('Lançamento excluído');
  }
  else if(a==='delg'){
    const removed=S.lanc.filter(l=>l.grp===id);
    S.lanc=S.lanc.filter(l=>l.grp!==id);save();
    ui.undo={type:'grp',items:removed,ts:Date.now()};
    showUndo('Parcelas excluídas');
  }
  else if(a==='addK'){const n=$('#nk-n').value.trim();if(n){S.cartoes.push({id:uid(),nome:n});save();}}
  else if(a==='delK'){if(S.lanc.some(l=>l.meio===id))toast('Cartão em uso. Exclua os lançamentos antes.');else{S.cartoes=S.cartoes.filter(k=>k.id!==id);save();}}
  else if(a==='goto'){ui.tab=b.dataset.to;if(b.dataset.to==='orc'&&b.dataset.t)ui.t=b.dataset.t;}
  else if(a==='limites'){ui.sheet='limites';}
  else if(a==='notifs'){ui.sheet='notifs';}
  else if(a==='search'){/* handled on input */}
  else if(a==='undo'){
    if(ui.undo&&ui.undo.items){S.lanc.push(...ui.undo.items);save();ui.undo=null;hideUndo();toast('Exclusão desfeita');}
  }
  else if(a==='edit'){ui.editId=id;ui.sheet='edit';}
  else if(a==='saveedit'){
    const l=S.lanc.find(x=>x.id===ui.editId);if(!l){ui.sheet=null;render();return;}
    const v=num($('#e-v').value),dt=$('#e-dt').value,desc=$('#e-d').value.trim(),it=$('#e-i').value,meio=$('#e-m').value;
    if(!(v>0)||!dt||!it){toast('Preencha valor, data e item.');return;}
    const scope=$('#e-scope')?$('#e-scope').value:'one';
    if(l.grp&&scope==='future'){
      const grp=S.lanc.filter(x=>x.grp===l.grp&&x.parc).sort((a,b)=>a.parc.localeCompare(b.parc));
      const from=grp.findIndex(x=>x.id===l.id);
      grp.slice(from).forEach(x=>{x.valor=v;x.item=it;x.desc=desc||item(it).nome;x.meio=meio;});
    } else {
      l.valor=v;l.item=it;l.desc=desc||item(it).nome;l.meio=meio;
      if(dt){l.dia=dt.slice(8);l.mes=dt.slice(0,7);}
    }
    save();ui.sheet=null;ui.editId=null;toast('Lançamento atualizado');
  }
  else if(a==='savelim'){
    S.limites=S.limites||{global:80,cats:{}};
    S.limites.global=Math.max(1,Math.min(100,parseInt($('#lim-g').value)||80));
    const cats={};
    document.querySelectorAll('.lim-cat-on:checked').forEach(cb=>{
      const g=cb.dataset.cat;
      let inp=null;
      document.querySelectorAll('input[data-cat-val]').forEach(i=>{if(i.dataset.catVal===g)inp=i;});
      cats[g]=Math.max(1,Math.min(100,parseInt(inp&&inp.value)||80));
    });
    S.limites.cats=cats;
    save();ui.sheet=null;toast('Limites salvos');
  }
  else if(a==='demo'||a==='reset'){
    if(ui.arm!==a)ui.arm=a;
    else{S=a==='demo'?seed():{itens:mkItens(),cartoes:[],lanc:[]};ui.arm=null;save();toast(a==='demo'?'Exemplo carregado':'Dados zerados');}
  }
  else if(a==='import-plan'){resetImp();ensureXlsx().then(()=>{ui.sheet='import-plan';render();}).catch(()=>toast('Não foi possível carregar o leitor de planilhas (precisa de internet).'));return;}
  else if(a==='import-pdf'){resetImp();ui.imp.kind='pdf';ui.imp.cardId=S.cartoes[0]?.id||'';ensurePdfJs().then(()=>{ui.sheet='import-pdf';render();}).catch(()=>toast('Não foi possível carregar o leitor de PDF (precisa de internet).'));return;}
  else if(a==='pick-plan')$('#imp-file').click();
  else if(a==='pick-pdf')$('#imp-pdf').click();
  else if(a==='imp-prev'){
    const m={data:$('#im-data')?.value??ui.imp.map.data,valor:$('#im-valor')?.value??ui.imp.map.valor,desc:$('#im-desc')?.value??'',cat:$('#im-cat')?.value??'',item:$('#im-item')?.value??'',tipo:'',meio:''};
    ui.imp.map=m;ui.imp.createItems=$('#im-create')?.checked!==false;
    if(ui.imp.kind==='plano'||ui.imp.kind==='vf'){const n=importVfPlano(ui.imp.rows);ui.imp.report={imp:n,skip:0,rej:0};ui.imp.step='done';save();toast(n+' célula(s) de planejamento importada(s)');}
    else ui.imp.preview=buildLancPreview(ui.imp.rows,m,{create:ui.imp.createItems,meio:'deb'});
    if(!ui.imp.preview.filter(r=>r.ok).length)toast('Nenhuma linha válida. Ajuste o mapeamento.');
  }
  else if(a==='imp-go'){
    if(ui.imp.kind==='pdf'&&!ui.imp.cardId){toast('Selecione o cartão.');return;}
    commitImp();
  }
  render();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='imp-file'&&t.files[0]){try{await ensureXlsx();const wb=await readSpreadsheet(t.files[0]);ui.imp.wb=wb;ui.imp.sheets=wb.SheetNames;ui.imp.sheetName=wb.SheetNames[0];const ws=wb.Sheets[ui.imp.sheetName];ui.imp.rows=rowsFromSheet(ws);ui.imp.headers=ui.imp.rows[0]||[];ui.imp.kind=detectLayout(ui.imp.rows);ui.imp.map=guessMap(ui.imp.headers);ui.imp.preview=[];toast(ui.imp.kind==='plano'?'Layout de orçamento detectado':ui.imp.kind==='vf'?'Modelo Vida Financeira detectado':'Arquivo carregado — mapeie as colunas');}catch(err){toast('Erro ao ler planilha. Verifique o arquivo e a conexão.');}render();return;}
  if(t.id==='imp-pdf'&&t.files[0]){try{await ensurePdfJs();const text=await readPdf(t.files[0]);ui.imp.cardId=ui.imp.cardId||S.cartoes[0]?.id||'';ui.imp.preview=buildPdfPreview(text,ui.imp.cardId);ui.imp.kind='pdf';if(!ui.imp.preview.length)toast('Nenhuma compra encontrada — revise o PDF ou mapeie manualmente');else toast(ui.imp.preview.length+' linha(s) extraída(s)');}catch(err){toast('Erro ao ler PDF. Use PDF com texto selecionável e conexão ativa.');}render();return;}
  if(t.id==='imp-sheet'){const ws=ui.imp.wb.Sheets[t.value];ui.imp.sheetName=t.value;ui.imp.rows=rowsFromSheet(ws);ui.imp.headers=ui.imp.rows[0]||[];ui.imp.kind=detectLayout(ui.imp.rows);ui.imp.map=guessMap(ui.imp.headers);ui.imp.preview=[];render();return;}
  if(t.id==='im-card'){ui.imp.cardId=t.value;return;}
  if(t.dataset.fl){const f=t.dataset.fl;ui[f]=t.value;if(f==='de'&&ui.de>ui.ate)ui.ate=ui.de;if(f==='ate'&&ui.ate<ui.de)ui.de=ui.ate;render();return;}
  if(t.id==='f-t'){$('#f-i').innerHTML=optsItens(t.value);prev();return;}
  if(t.classList.contains('lim-cat-on')){
    const g=t.dataset.cat;
    const inp=document.querySelector('[data-cat-val="'+g.replace(/"/g,'\"')+'"]');
    if(inp)inp.disabled=!t.checked;
    return;
  }
  const f=t.dataset.f,k=S.cartoes.find(x=>x.id===t.dataset.id);
  if(f==='kn'&&k){k.nome=t.value||k.nome;save();render();}
});
document.addEventListener('input',e=>{
  if(e.target.closest('#sheet')&&ui.sheet==='novo')prev();
  if(e.target.id==='lq'){ui.q=e.target.value;render();}
});
try{render();}catch(e){const app=document.getElementById('app');if(app){const m=document.createElement('div');m.style.cssText='margin:16px;padding:16px;background:#FDECEA;color:#8B1E1E;border-radius:8px;font:14px Roboto,sans-serif';m.innerHTML='<b>Erro ao carregar o protótipo.</b><br>'+esc(e.message)+'<br><small>Tente Ctrl+F5. Se persistir: F12 → Application → Local Storage → apague <code>orcamento-vf-v1</code>.</small>';app.appendChild(m);}}
window.addEventListener('error',e=>{const app=document.getElementById('app');if(app&&!app.innerHTML){app.innerHTML='<div style="margin:16px;padding:16px;background:#FDECEA;color:#8B1E1E;border-radius:8px"><b>Erro no protótipo.</b><br>'+String(e.message||e)+'</div>';}});

})();
</script>
</body>
</html>
