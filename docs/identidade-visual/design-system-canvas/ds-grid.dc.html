<style>@font-face {
  font-family: "Manrope";

/* Meu Orçamento · tokens v0.1 (proposta para aprovação)
   Tema claro. Tema escuro: pendente. */
:root {
  /* Cor · marca */
  --md-brand-yellow: #ffe600;
  --md-brand-ink: #191c20;
  --md-brand-blue: #0058be;

  /* Cor · função */
  --md-action: #0058be;
  --md-on-action: #ffffff;
  --md-text: #191c20;
  --md-text-muted: #43474e;
  --md-surface: #f8f9ff;
  --md-card: #ffffff;
  --md-line: #e3e6ef;
  --md-field: #eceef6;
  --md-selected: #d7e3ff;
  --md-on-selected: #001b3f;

  /* Cor · estado */
  --md-success: #2e7d32;
  --md-warn-text: #6b4b00;
  --md-warn-bar: #9a6b00;
  --md-warn-bg: #fff3c4;
  --md-error: #ba1a1a;
  --md-error-text: #410002;
  --md-error-bg: #ffdad6;
  --md-snackbar: #2f3033;
  --md-snackbar-text: #f1f0f4;
  --md-snackbar-action: #adc6ff;

  /* Espaço (escala de 4) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* Raio */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-sheet: 28px;
  --radius-full: 999px;

  /* Elevação */
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(25, 28, 32, 0.06);
  --elevation-2: 0 8px 24px rgba(25, 28, 32, 0.16);
  --elevation-fab: 0 4px 12px rgba(0, 88, 190, 0.3);

  /* Tipo: família e escala */
  --font-family: "Manrope", "Segoe UI", sans-serif;
  --type-display-lg-size: 56px; --type-display-lg-line: 60px;
  --type-display-md-size: 40px; --type-display-md-line: 44px;
  --type-title-lg-size: 28px;   --type-title-lg-line: 32px;
  --type-title-md-size: 20px;   --type-title-md-line: 24px;
  --type-body-size: 16px;       --type-body-line: 24px;
  --type-label-size: 14px;      --type-label-line: 20px;
  --type-caption-size: 12px;    --type-caption-line: 16px;

  /* Movimento */
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --motion-slow: 300ms;
  --motion-easing: cubic-bezier(0.2, 0, 0, 1);
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-fast: 0ms; --motion-base: 0ms; --motion-slow: 0ms; }
}

/* Estados de interação (v0.2) */
:root {
  --state-hover-filter: brightness(0.94);
  --state-pressed-scale: 0.98;
  --state-focus-width: 2px;
  --state-focus-offset: 2px;
  --state-disabled-opacity: 0.38;
}

/* Grid (v0.2) */
:root {
  --breakpoint-desktop: 720px;     /* a partir daqui: barra lateral e grid de 12 colunas */
  --sidebar-width: 240px;

  /* Celular (até 719 px): 4 colunas */
  --grid-columns-mobile: 4;
  --grid-margin-mobile: 16px;
  --grid-gutter-mobile: 16px;

  /* Desktop (a partir de 720 px): 12 colunas dentro da área de conteúdo */
  --grid-columns-desktop: 12;
  --grid-margin-desktop: 40px;
  --grid-gutter-desktop: 24px;
}
</style>
</head>
